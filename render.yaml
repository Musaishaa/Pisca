services:
  - type: web
    name: pisca
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: none
      - key: PYTHON_VERSION
        value: 3.11.9
